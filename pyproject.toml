[project]
name = "iotspec"
version = "0.2.0.dev0"
description = "iot-common-spec: 作品01〜04 が共有する通信・データ仕様の実体（Schema・サンプル・UART ゴールデン・シミュレータ・契約テスト）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "aiomqtt>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iotspec"]

[tool.hatch.build.targets.wheel.force-include]
# 他作品が iotspec を取り込んだときも Schema を読めるよう、パッケージに同梱する
"schemas" = "iotspec/_schemas"
"profiles" = "iotspec/_profiles"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 日本語の docstring・コメント・文字列で全角の括弧やコロン、× を使うため、紛らわしい文字の検査は外す
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "integration: Mosquitto などの外部プロセスを必要とする結合テスト（docker compose up -d mosquitto が前提）",
]
