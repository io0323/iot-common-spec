# iot-common-spec の Mosquitto 設定（共通仕様 v0.2.1 第8章「MQTTの認証とACL」）
# パスワードファイルはリポジトリに入れない。deploy/mosquitto/gen_passwd.sh で作る。
per_listener_settings false
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
